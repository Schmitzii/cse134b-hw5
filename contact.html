    <main id="contact-page-main">
        <section>
            <h2>Get in Touch</h2>
            <p>Please fill out the form below to contact me.</p>

            <form action="#" method="GET" novalidate>
                <fieldset>
                    <legend>Contact Form</legend>

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required><br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Your Email" required><br><br>

                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" placeholder="What's your matter?" required><br><br>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" cols="40" minlength="5" maxlength="300"
                        pattern="[A-Za-z0-9 .,!?'\-()]*" placeholder="Your message..." required></textarea><br><br>

                    <input type="hidden" name="form-errors" id="form-errors" value="[]">

                    <button type="submit">Submit</button>

                    <output name="errors"></output>
                    <output name="information"></output>
                </fieldset>
            </form>
